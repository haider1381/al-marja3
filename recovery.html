<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>تعيين كلمة المرور — المرجع</title>
<style>body{font-family:system-ui;background:#f5f5f5;color:#222;margin:0;padding:24px}main{max-width:420px;margin:40px auto;background:white;padding:24px;border-radius:16px}label,input,button{display:block;box-sizing:border-box;width:100%;margin:12px 0}input,button{padding:12px;font:inherit}#status{white-space:pre-wrap}@media(prefers-color-scheme:dark){body{background:#151515;color:#eee}main{background:#252525}input{background:#333;color:#eee}}

/* Three organ outline marks, scrolling with the page like the site's home symbols. */
body{position:relative}
.organ-mark{position:absolute;pointer-events:none;opacity:.3;z-index:0}
@media (prefers-color-scheme:dark){.organ-mark{opacity:.22}}
.organ-mark svg{width:100%;height:100%;display:block}
.organ-mark-s1{width:84px;height:84px;left:4%;top:18px;transform:rotate(-8deg)}
.organ-mark-s2{width:76px;height:76px;right:5%;top:42%;transform:rotate(7deg)}
.organ-mark-s3{width:68px;height:68px;left:12%;bottom:24px;transform:rotate(-4deg);opacity:.24}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><span class="organ-mark organ-mark-s1" aria-hidden="true" style="color:#8f7fe0"><svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 14C33 8 22 10 20 19C11 20 7 30 12 37C7 44 11 54 20 55C22 64 33 67 40 61C47 67 58 64 60 55C69 54 73 44 68 37C73 30 69 20 60 19C58 10 47 8 40 14Z"/><path d="M40 14V61M26 28C30 30 30 35 26 38M54 28C50 30 50 35 54 38M24 47C29 46 32 49 31 53M56 47C51 46 48 49 49 53"/></svg></span><span class="organ-mark organ-mark-s2" aria-hidden="true" style="color:#5aa6e0"><svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M40 6V30M40 30C36 34 32 36 28 38M40 30C44 34 48 36 52 38"/><path d="M34 22C24 22 14 34 12 50C10 64 16 72 26 70C33 69 36 62 36 52V30M46 22C56 22 66 34 68 50C70 64 64 72 54 70C47 69 44 62 44 52V30"/></svg></span><span class="organ-mark organ-mark-s3" aria-hidden="true" style="color:#e5737d"><svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M30 31C21 34 15 43 17 54C19 66 31 75 44 73C57 71 65 60 63 46C62 38 57 32 50 30"/><path d="M37 31C36 21 40 13 49 11C56 10 61 14 60 21"/><path d="M44 13V5M50 11V3M56 13V6"/><path d="M33 31C31 24 26 20 19 20M28 35C23 29 23 20 26 12M38 40C43 50 43 59 38 67"/></svg></span><main><h1>تعيين كلمة المرور</h1><p>افتح هذه الصفحة من رابط الدعوة أو استعادة كلمة المرور في بريدك.</p>
<form id="passwordForm" hidden><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button id="save" type="submit">حفظ كلمة المرور</button></form>
<p id="status" role="status" aria-live="polite">جارٍ التحقق من رابط الدخول…</p><a href="./index.html">العودة لتسجيل الدخول</a></main>
<script>
let authClient;
let savingPassword = false;
const statusEl = document.getElementById('status');
const form = document.getElementById('passwordForm');
async function initPasswordPage() {
 try {
  if (!window.supabase) throw new Error('client unavailable');
  authClient = window.supabase.createClient('https://wuvzteosknrzddsaexez.supabase.co', 'sb_publishable_xp2-QPjUpKMxskVfVksY7A_taxJXsPD');
  const { data, error } = await authClient.auth.getSession();
  history.replaceState(null, '', location.pathname);
  if (error || !data.session) {
   statusEl.textContent = 'الرابط غير صالح أو انتهت صلاحيته. ارجع للدخول واطلب رابط استعادة جديدًا.';
   return;
  }
  form.hidden = false;
  statusEl.textContent = '';
 } catch (_) {
  statusEl.textContent = 'تعذّر التحقق من الرابط. تحقق من الاتصال ثم أعد فتح رابط البريد.';
 }
}
form.addEventListener('submit', async event => {
 event.preventDefault();
 if (!authClient || savingPassword) return;
 const password = document.getElementById('password').value;
 if (password.length < 8 || password !== document.getElementById('confirmPassword').value) {
  statusEl.textContent = 'اكتب كلمة مرور من 8 أحرف على الأقل، وتأكد من تطابقها.';
  return;
 }
 savingPassword = true;
 document.getElementById('save').disabled = true;
 try {
  const { error } = await authClient.auth.updateUser({ password });
  if (error) throw error;
  form.reset();
  form.hidden = true;
  statusEl.textContent = 'تم حفظ كلمة المرور. يمكنك العودة لتسجيل الدخول.';
  await authClient.auth.signOut({ scope: 'local' });
 } catch (_) {
  statusEl.textContent = 'تعذّر حفظ كلمة المرور. قد يكون الرابط منتهيًا أو كلمة المرور لا تطابق متطلبات الأمان.';
 } finally {
  savingPassword = false;
  document.getElementById('save').disabled = false;
 }
});
initPasswordPage();
</script></body></html>
