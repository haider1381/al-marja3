<main><section id="booksPanel" hidden><div id="bookList"></div></section><section id="editor" hidden><h2 id="bookTitle" hidden></h2><div class="toolbar pdf-toolbar"><button data-tool="pen" aria-pressed="true" aria-label="قلم" title="قلم"><svg viewBox="0 0 24 24" class="ic-color"><path d="M15.6 3.6a2.2 2.2 0 0 1 3.1 0l1.7 1.7a2.2 2.2 0 0 1 0 3.1L9.5 19.3l-4.8-4.8z" fill="#0F6CBD"/><path d="m13.9 5.3 4.8 4.8-1.5 1.5-4.8-4.8z" fill="#FFC83D"/><path d="M4.7 14.5 9.5 19.3 3 21z" style="fill:var(--c,#111827)"/></svg></button><button data-tool="marker" aria-label="قلم ملون" title="قلم ملون"><svg viewBox="0 0 24 24"><path d="M6 19 18 5l3 3L9 22H5z" fill="#a78bfa" stroke="#d8c7ff"/><path d="M12 12 16 16" stroke="#fff"/></svg></button><button data-tool="highlight" aria-label="تظليل" title="تظليل"><svg viewBox="0 0 24 24" class="ic-color"><path d="M14.8 3.4 20.6 9.2 12 17.8 6.2 12z" style="fill:var(--c,#fde047)" stroke="#0b4f8f" stroke-width="1.4" stroke-linejoin="round"/><path d="m6.2 12 5.8 5.8-2.3 1.7-5.2-.1-.5-.5L4 13.7z" fill="#0F6CBD"/><path d="M3.5 21h6" stroke="#0b4f8f" stroke-width="1.6" stroke-linecap="round"/></svg></button><button data-tool="erase" aria-label="ممحاة" title="ممحاة"><svg viewBox="0 0 24 24"><path class="ic-soft" d="M14.2 4.6a2 2 0 0 1 2.8 0l3.4 3.4a2 2 0 0 1 0 2.8l-8.2 8.2H8.4L4 14.6a2 2 0 0 1 0-2.8z"/><path d="m8.5 10.3 5.2 5.2M12.5 19h7"/></svg></button><button data-tool="hand" aria-label="تمرير" title="تمرير"><svg viewBox="0 0 24 24"><path class="ic-soft" d="M8 13.5V6.2a1.6 1.6 0 0 1 3.2 0V11V4.8a1.6 1.6 0 0 1 3.2 0V11V6.4a1.6 1.6 0 0 1 3.2 0V12V9.6a1.5 1.5 0 0 1 3 0v4.6a6.8 6.8 0 0 1-6.8 6.8h-1.2a6.3 6.3 0 0 1-5-2.5l-3-4a1.6 1.6 0 0 1 2.5-2L8 15z"/></svg></button><button id="undo" aria-label="تراجع" title="تراجع"><svg viewBox="0 0 24 24"><path d="M9.5 6.5 5 11l4.5 4.5"/><path d="M5.5 11H15a4.5 4.5 0 0 1 0 9h-2"/></svg></button><label class="pdf-option" aria-label="لون القلم"><input id="color" type="color" value="#1c2344"></label><label class="pdf-option">سمك <input id="size" type="range" min="1" max="18" value="3"></label><label class="pdf-option"><input id="stylusOnly" type="checkbox" checked> القلم فقط</label><button id="sharePdf" aria-label="مشاركة" title="مشاركة"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2"/><circle cx="6" cy="12" r="2"/><circle cx="18" cy="19" r="2"/><path d="m8 11 8-5M8 13l8 5"/></svg></button><button id="savePdf" aria-label="حفظ PDF" title="حفظ PDF"><svg viewBox="0 0 24 24"><path d="M5 3h12l3 3v15H4V3zM8 3v7h8V3M8 21v-8h8v8"/></svg></button><button id="moreNotes" aria-label="المزيد" title="المزيد"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" class="ic-soft"/><circle cx="12" cy="7.8" r="1.2" class="ic-dot"/><circle cx="12" cy="12" r="1.2" class="ic-dot"/><circle cx="12" cy="16.2" r="1.2" class="ic-dot"/></svg></button></div><div id="extraNotes" class="toolbar pdf-extra" hidden><button id="addLined">+ صفحة مخططة</button><button id="addBlank">+ صفحة بيضاء</button><button id="exportBackup">نسخة احتياطية</button><button id="importBackup">استعادة نسخة</button><input id="backupFile" type="file" accept="application/json" hidden><button id="favoriteBook" hidden>☆ إضافة إلى مكتبتي</button></div><div id="pages"></div><div id="nextPageHint" class="next-page-hint" aria-live="polite">اسحب للأعلى لإنشاء صفحة جديدة ↓</div></section></main>

<script>
'use strict';
const KEY='medbrain_notebooks_v1';let books=[],current=null,tool='pen',active=null;let cloud=null,user=null,syncTimer=null,syncBusy=false,syncAgain=false,deletedIds=new Set(),deletedPageIds=new Set();
const $=id=>document.getElementById(id);
function load(){try{books=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(books))books=[]}catch(e){books=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(books))}catch(e){alert('مساحة التخزين ممتلئة. صدّر دفتر PDF قبل المتابعة.')} scheduleSync() }
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function page(kind='lined'){return {id:crypto.randomUUID(),kind,strokes:[]}}
function getBook(){return books.find(b=>b.id===current)}
function list(){const box=$('bookList');box.innerHTML=books.length?books.map(b=>'<div class="bookrow"><strong>'+esc(b.title)+'</strong><span class="muted">'+esc(b.subject)+' · '+b.pages.length+' صفحة</span><button data-open="'+b.id+'">فتح</button><button data-delete="'+b.id+'" class="danger">حذف</button></div>').join(''):'لا توجد دفاتر بعد. اضغط «دفتر جديد».';
box.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openBook(x.dataset.open));box.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>{if(confirm('حذف الدفتر نهائياً من هذا الجهاز؟')){deletedIds.add(x.dataset.delete);books=books.filter(b=>b.id!==x.dataset.delete);save();list()}})}
function openBook(id){current=id;$('booksPanel').hidden=true;$('editor').hidden=false;render()}
function render(){const b=getBook();if(!b)return;$('bookTitle').textContent=b.title+' — '+b.subject;$('favoriteBook').textContent=b.isFavorite?'★ إزالة من مكتبتي':'☆ إضافة إلى مكتبتي';$('pages').replaceChildren();b.pages.forEach((p,i)=>{const section=document.createElement('section');const paper=document.createElement('div');paper.className='paper '+(p.kind==='lined'?'lined':'');const canvas=document.createElement('canvas');canvas.addEventListener('click',()=>{if(!active)document.body.classList.toggle('paper-focus')});canvas.width=840;canvas.height=1188;canvas.dataset.id=p.id;paper.append(canvas);section.append(paper);const controls=document.createElement('div');controls.className='page-controls no-print';controls.innerHTML='<span>صفحة '+(i+1)+'</span><button data-remove="'+p.id+'">حذف الصفحة</button>';section.append(controls);$('pages').append(section);draw(canvas,p);bind(canvas,p);controls.querySelector('button').onclick=()=>{if(b.pages.length===1)return alert('يجب أن تبقى صفحة واحدة على الأقل');if(confirm('حذف هذه الصفحة؟')){deletedPageIds.add(p.id);b.pages=b.pages.filter(x=>x.id!==p.id);save();render()}}})}
function draw(c,p){const ctx=c.getContext('2d');const layer=document.createElement('canvas');layer.width=c.width;layer.height=c.height;const ink=layer.getContext('2d');for(const st of p.strokes){if(!st.points.length)continue;ink.save();ink.lineCap='round';ink.lineJoin='round';ink.lineWidth=st.width;ink.strokeStyle=st.color;ink.globalAlpha=st.kind==='highlight'?.28:1;ink.globalCompositeOperation=st.kind==='erase'?'destination-out':'source-over';ink.beginPath();ink.moveTo(st.points[0][0],st.points[0][1]);for(const xy of st.points.slice(1))ink.lineTo(xy[0],xy[1]);if(st.points.length===1)ink.lineTo(st.points[0][0]+.1,st.points[0][1]+.1);ink.stroke();ink.restore()}ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);if(p.kind==='lined'){ctx.strokeStyle='#b7cbea';ctx.lineWidth=1;for(let y=28;y<c.height;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}}ctx.drawImage(layer,0,0);c.style.backgroundColor='#ffffff';c.style.colorScheme='light'}


function point(c,e){const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}
function bind(c,p){c.addEventListener('pointerdown',e=>{if(tool==='hand'||($('stylusOnly').checked&&e.pointerType!=='pen'))return;if(e.pointerType==='touch'&&$('stylusOnly').checked)return;e.preventDefault();c.classList.add('drawing');c.parentElement.classList.add('inking');const st={kind:tool,color:tool==='marker'?'#8757d9':$('color').value,width:Number($('size').value)*(tool==='highlight'?5:tool==='erase'?7:tool==='marker'?2:1),points:[point(c,e)]};p.strokes.push(st);active={c,p,st,id:e.pointerId};c.setPointerCapture(e.pointerId);draw(c,p)});c.addEventListener('pointermove',e=>{if(!active||active.c!==c||active.id!==e.pointerId)return;e.preventDefault();active.st.points.push(point(c,e));draw(c,p)});const end=e=>{if(!active||active.c!==c||active.id!==e.pointerId)return;active=null;c.parentElement.classList.remove('inking');save()};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end)}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{document.body.classList.remove('paper-focus');tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
$('newBook').onclick=()=>{$('newTitle').value='';$('newSubject').value='';$('newDialog').showModal()};
$('createBook').onclick=e=>{const title=$('newTitle').value.trim();if(!title){e.preventDefault();return alert('اكتب اسم الدفتر')}const b={id:crypto.randomUUID(),title,subject:$('newSubject').value.trim(),pages:[page()]};books.unshift(b);save();list();openBook(b.id)};
$('showBooks').onclick=()=>{current=null;$('editor').hidden=true;$('booksPanel').hidden=false;list()};
$('addLined').onclick=()=>{getBook().pages.push(page('lined'));save();render()};
$('addBlank').onclick=()=>{getBook().pages.push(page('blank'));save();render()};
$('undo').onclick=()=>{const b=getBook();for(let i=b.pages.length-1;i>=0;i--)if(b.pages[i].strokes.length){b.pages[i].strokes.pop();save();render();return}};
$('savePdf').onclick=()=>void outputPdf(false);$('sharePdf').onclick=()=>void outputPdf(true);$('moreNotes').onclick=()=>{$('extraNotes').hidden=!$('extraNotes').hidden};$('favoriteBook').onclick=()=>{const b=getBook();if(!b)return;b.isFavorite=!b.isFavorite;save();render()};
$('exportBackup').onclick=()=>{const blob=new Blob([JSON.stringify({type:'medbrain-notebooks',version:1,books},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='medbrain-notebooks-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('importBackup').onclick=()=>$('backupFile').click();
$('backupFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const payload=JSON.parse(await file.text());if(payload.type!=='medbrain-notebooks'||!Array.isArray(payload.books)||payload.books.length>300)throw Error('invalid');const clean=payload.books.filter(b=>b&&typeof b.title==='string'&&Array.isArray(b.pages)&&b.pages.length<=500).map(b=>({id:crypto.randomUUID(),title:b.title.slice(0,80),subject:String(b.subject||'').slice(0,80),pages:b.pages.filter(p=>p&&['lined','blank'].includes(p.kind)&&Array.isArray(p.strokes)).map(p=>({id:crypto.randomUUID(),kind:p.kind,strokes:p.strokes.slice(0,2000).filter(st=>st&&Array.isArray(st.points)&&st.points.length<20000).map(st=>({kind:['pen','highlight','erase'].includes(st.kind)?st.kind:'pen',color:/^#[0-9a-fA-F]{6}$/.test(st.color)?st.color:'#222222',width:Math.max(1,Math.min(100,Number(st.width)||3)),points:st.points.filter(pt=>Array.isArray(pt)&&pt.length===2&&pt.every(Number.isFinite)).slice(0,20000)}))}))}));if(!clean.length)throw Error('empty');if(!confirm('استيراد '+clean.length+' دفتر إلى هذا الجهاز؟'))return;books.push(...clean);save();list();alert('تم الاستيراد')}catch(_){alert('ملف النسخة الاحتياطية غير صالح')}e.target.value=''};


async function outputPdf(share){const b=getBook();if(!b)return;const ctor=window.jspdf?.jsPDF;if(!ctor){alert('تعذر تحميل أداة PDF. تحقق من الاتصال بالإنترنت.');return}const pdf=new ctor({orientation:'portrait',unit:'mm',format:'a4',compress:true});for(let i=0;i<b.pages.length;i++){if(i)pdf.addPage('a4','portrait');const p=b.pages[i];const c=document.createElement('canvas');c.width=840;c.height=1188;const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,c.width,c.height);if(p.kind==='lined'){ctx.strokeStyle='#b7cbea';ctx.lineWidth=1;for(let y=28;y<c.height;y+=28){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}}const ink=document.createElement('canvas');ink.width=c.width;ink.height=c.height;draw(ink,p);ctx.drawImage(ink,0,0);pdf.addImage(c.toDataURL('image/jpeg',.88),'JPEG',0,0,210,297,undefined,'FAST')}const blob=pdf.output('blob');const filename=(b.title||'Medbrain')+'.pdf';if(share&&navigator.share&&navigator.canShare){const file=new File([blob],filename,{type:'application/pdf'});if(navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:b.title||'Medbrain'});return}catch(e){if(e.name==='AbortError')return}}}pdf.save(filename)}
function syncLabel(message){$('syncStatus').textContent=message}
function scheduleSync(){if(!user||!cloud)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>void syncCloud(),1800)}
async function syncCloud(){
 if(!user||!cloud)return;
 if(syncBusy){syncAgain=true;return}
 syncBusy=true;syncLabel('جارٍ حفظ الدفاتر في الحساب…');
 try{
  for(const id of deletedIds){const {error}=await cloud.from('student_notebooks').delete().eq('id',id).eq('user_id',user.id);if(error)throw error;deletedIds.delete(id)}
  for(const id of deletedPageIds){const {error}=await cloud.from('student_notebook_pages').delete().eq('id',id);if(error)throw error;deletedPageIds.delete(id)}
  for(const b of books){
   const {error}=await cloud.from('student_notebooks').upsert({id:b.id,user_id:user.id,title:b.title,subject:b.subject||'',source_name:b.source_name||'',lecture_id:b.lectureId||null,is_favorite:!!b.isFavorite},{onConflict:'id'});if(error)throw error;
   for(let i=0;i<b.pages.length;i++){
    const p=b.pages[i];
    const {error:pageError}=await cloud.from('student_notebook_pages').upsert({id:p.id,notebook_id:b.id,page_order:i,paper_size:'A4',paper_type:p.kind==='blank'?'blank':'lined',strokes:p.strokes},{onConflict:'id'});if(pageError)throw pageError;
   }
  }
  syncLabel('✓ الدفاتر محفوظة في حسابك');
 }catch(e){console.warn('notebook sync failed',e);syncLabel('الحفظ على الجهاز فقط — تعذرت المزامنة. احتفظ بنسخة احتياطية')}
 finally{syncBusy=false;if(syncAgain){syncAgain=false;scheduleSync()}}
}
async function initializeCloud(){
 try{
  if(!window.supabase){syncLabel('الحفظ محلي — خدمة الحساب غير متاحة');return}
  cloud=window.supabase.createClient('https://wuvzteosknrzddsaexez.supabase.co','sb_publishable_xp2-QPjUpKMxskVfVksY7A_taxJXsPD',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const {data:{user:account},error}=await cloud.auth.getUser();if(error||!account){syncLabel('الحفظ على الجهاز — سجّل الدخول للمزامنة');return}
  user=account;
  const {data:remote,error:fetchError}=await cloud.from('student_notebooks').select('id,title,subject,source_name,lecture_id,is_favorite').eq('user_id',user.id);
  if(fetchError)throw fetchError;
  const remoteBooks=[];
  for(const row of remote||[]){
   const {data:pages,error:pageError}=await cloud.from('student_notebook_pages').select('id,page_order,paper_type,strokes').eq('notebook_id',row.id).order('page_order');
   if(pageError)throw pageError;
   remoteBooks.push({id:row.id,title:row.title,subject:row.subject,source_name:row.source_name,lectureId:row.lecture_id,isFavorite:row.is_favorite,pages:(pages||[]).map(p=>({id:p.id,kind:p.paper_type,strokes:p.strokes||[]}))});
  }
  const existing=new Set(books.map(b=>b.id));
  for(const b of remoteBooks)if(!existing.has(b.id))books.push(b);
  try{localStorage.setItem(KEY,JSON.stringify(books))}catch(_){}
  list();if(current)render();else if(direct&&books.some(b=>b.id===direct))openBook(direct);
  syncLabel('✓ الحساب متصل — المزامنة مفعّلة');scheduleSync();
 }catch(e){console.warn('notebook cloud initialization failed',e);syncLabel('الحفظ على الجهاز فقط — فشلت المزامنة')}
}

let swipeStartY=null,swipeStartAtBottom=false,lastAutoPage=0;let hintTimeout=null;
window.addEventListener('touchstart',e=>{if(e.touches.length!==1||!getBook())return;swipeStartY=e.touches[0].clientY;swipeStartAtBottom=window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-85;if(swipeStartAtBottom){document.getElementById('nextPageHint')?.classList.add('visible');clearTimeout(hintTimeout);hintTimeout=setTimeout(()=>document.getElementById('nextPageHint')?.classList.remove('visible'),2200)}},{passive:true});
window.addEventListener('touchend',e=>{if(swipeStartY===null||!swipeStartAtBottom||!getBook())return;const dy=e.changedTouches[0].clientY-swipeStartY;swipeStartY=null;if(dy< -85&&Date.now()-lastAutoPage>1600){lastAutoPage=Date.now();document.getElementById('nextPageHint')?.classList.remove('visible');const b=getBook();b.pages.push(page(b.pages[b.pages.length-1]?.kind||'lined'));save();render();setTimeout(()=>document.querySelector('#pages>section:last-child')?.scrollIntoView({behavior:'smooth',block:'start'}),100)}},{passive:true});
load();list();
const params=new URLSearchParams(location.search);const direct=params.get('id');const create=params.get('create');
if(create==='lined'||create==='blank'){const id=crypto.randomUUID();const b={id,title:'ID-'+id.slice(0,8),subject:'',isFavorite:true,pages:[page(create)]};books.unshift(b);save();openBook(id)}else if(direct&&books.some(b=>b.id===direct)){openBook(direct)}
const linked=new URLSearchParams(location.search);const lec=linked.get('lecture');if(lec&&/^[a-zA-Z0-9_-]{1,100}$/.test(lec)){const found=books.find(b=>b.lectureId===lec);if(found){openBook(found.id)}else{const b={id:crypto.randomUUID(),title:(linked.get('title')||'ملاحظات المحاضرة').slice(0,80),subject:'محاضرة مرتبطة',lectureId:lec,pages:[page()]};books.unshift(b);save();list();openBook(b.id)}}
void initializeCloud().then(async()=>{if(direct&&!getBook()&&books.some(b=>b.id===direct))openBook(direct);if(!getBook()&&!create&&!direct){location.replace('./')}});
</script></html>
